        env:
          TEST_NAME: roundEvenPow2
          GRADER_COMMAND: "./check_ops.py --function roundEvenPow2 bits.c && ./btest -f roundEvenPow2"
          EXPECTED_OUTPUT: "Total points: 5/5"
          COMPARISON_METHOD: contains
