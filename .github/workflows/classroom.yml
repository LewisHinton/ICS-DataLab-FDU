          TEST_NAME: rotateRightBits
          GRADER_COMMAND: "./check_ops.py --function rotateRightBits bits.c && ./btest -f rotateRightBits"
          EXPECTED_OUTPUT: "Total points: 5/5"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "5"
        run: bash .github/scripts/autograde.sh

      - name: roundEvenPow2
