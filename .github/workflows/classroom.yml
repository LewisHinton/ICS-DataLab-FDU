          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "7"
        run: bash .github/scripts/autograde.sh

      - name: mul5Sat
        id: mul5sat
        env:
          TEST_NAME: mul5Sat
          GRADER_COMMAND: "./check_ops.py --function mul5Sat bits.c && ./btest -f mul5Sat"
          EXPECTED_OUTPUT: "Total points: 7/7"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "7"
        run: bash .github/scripts/autograde.sh

      - name: classifyAdd3
        id: classifyadd3
        env:
          TEST_NAME: classifyAdd3
          GRADER_COMMAND: "./check_ops.py --function classifyAdd3 bits.c && ./btest -f classifyAdd3"
          EXPECTED_OUTPUT: "Total points: 7/7"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "7"
        run: bash .github/scripts/autograde.sh

      - name: floatScaleThreeHalves
        id: floatscalethreehalves
        env:
          TEST_NAME: floatScaleThreeHalves
          GRADER_COMMAND: "./check_ops.py --function floatScaleThreeHalves bits.c && ./btest -f floatScaleThreeHalves"
          EXPECTED_OUTPUT: "Total points: 7/7"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "7"
        run: bash .github/scripts/autograde.sh

      - name: floatRoundEven
        id: floatroundeven
        env:
          TEST_NAME: floatRoundEven
          GRADER_COMMAND: "./check_ops.py --function floatRoundEven bits.c && ./btest -f floatRoundEven"
          EXPECTED_OUTPUT: "Total points: 10/10"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "10"
        run: bash .github/scripts/autograde.sh

      - name: float_i2f
        id: float_i2f
        env:
          TEST_NAME: float_i2f
          GRADER_COMMAND: "./check_ops.py --function float_i2f bits.c && ./btest -f float_i2f"
          EXPECTED_OUTPUT: "Total points: 10/10"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "10"
        run: bash .github/scripts/autograde.sh

      - name: bitCount
        id: bitcount
        env:
          TEST_NAME: bitCount
          GRADER_COMMAND: "./check_ops.py --function bitCount bits.c && ./btest -f bitCount"
          EXPECTED_OUTPUT: "Total points: 10/10"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "10"
        run: bash .github/scripts/autograde.sh

      - name: bitReverse
        id: bitreverse
        env:
          TEST_NAME: bitReverse
          GRADER_COMMAND: "./check_ops.py --function bitReverse bits.c && ./btest -f bitReverse"
          EXPECTED_OUTPUT: "Total points: 10/10"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "10"
        run: bash .github/scripts/autograde.sh

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          SIGNMASK_RESULTS: "${{steps.signmask.outputs.result}}"
          BITXOR_RESULTS: "${{steps.bitxor.outputs.result}}"
          COPYBYTEWITHIN_RESULTS: "${{steps.copybytewithin.outputs.result}}"
          ROUNDEVENPOW2_RESULTS: "${{steps.roundevenpow2.outputs.result}}"
          NEGATIVEPART_RESULTS: "${{steps.negativepart.outputs.result}}"
          ISBETWEENEITHERORDER_RESULTS: "${{steps.isbetweeneitherorder.outputs.result}}"
          LOGICALSHIFT_RESULTS: "${{steps.logicalshift.outputs.result}}"
          SWAPNIBBLEPAIRS_RESULTS: "${{steps.swapnibblepairs.outputs.result}}"
          SECONDLOWESTZEROBIT_RESULTS: "${{steps.secondlowestzerobit.outputs.result}}"
          ROTATERIGHTBITS_RESULTS: "${{steps.rotaterightbits.outputs.result}}"
          MIDPOINTTOWARDFIRST_RESULTS: "${{steps.midpointtowardfirst.outputs.result}}"
          CLASSIFYADD3_RESULTS: "${{steps.classifyadd3.outputs.result}}"
          MUL5SAT_RESULTS: "${{steps.mul5sat.outputs.result}}"
          FLOATROUNDEVEN_RESULTS: "${{steps.floatroundeven.outputs.result}}"
          FLOATSCALETHREEHALVES_RESULTS: "${{steps.floatscalethreehalves.outputs.result}}"
          FLOAT_I2F_RESULTS: "${{steps.float_i2f.outputs.result}}"
          ODDPARITY_RESULTS: "${{steps.oddparity.outputs.result}}"
          BITCOUNT_RESULTS: "${{steps.bitcount.outputs.result}}"
          BITREVERSE_RESULTS: "${{steps.bitreverse.outputs.result}}"
        with:
          runners: signmask,bitxor,negativepart,copybytewithin,logicalshift,swapnibblepairs,secondlowestzerobit,oddparity,rotaterightbits,roundevenpow2,midpointtowardfirst,isbetweeneitherorder,mul5sat,classifyadd3,floatscalethreehalves,floatroundeven,float_i2f,bitcount,bitreverse
