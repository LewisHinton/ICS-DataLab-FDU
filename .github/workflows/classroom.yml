          TEST_NAME: oddParity
          GRADER_COMMAND: "./check_ops.py --function oddParity bits.c && ./btest -f oddParity"
          EXPECTED_OUTPUT: "Total points: 5/5"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "5"
        run: bash .github/scripts/autograde.sh

      - name: rotateRightBits
        id: rotaterightbits
