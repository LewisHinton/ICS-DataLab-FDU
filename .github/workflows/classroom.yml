name: Autograding Tests
"on":
  - push
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup runs once instead of once per test. The original workflow used the
      # io-grader's `setup-command` on every test, rebuilding the lab 20 times.
      # Built without -m32: the runner has no gcc-multilib, and int/unsigned are
      # 32-bit on x86-64 anyway.
      - name: Setup
        run: |
          chmod +x dlc check_ops.py
          make clean
          make all CFLAGS='-O -Wall -fwrapv'

      # Every problem is graded by combining its own operator/operand rule check
      # with its correctness test. A problem that uses illegal syntax or exceeds
      # its operator limit fails on its own and scores 0 for that problem only;
      # there is no separate global operator-check score. The scored total is
      # therefore exactly the lab's 110 correctness points.

      - name: signMask
        id: signmask
        env:
          TEST_NAME: signMask
          GRADER_COMMAND: "./check_ops.py --function signMask bits.c && ./btest -f signMask"
          EXPECTED_OUTPUT: "Total points: 1/1"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "1"
        run: bash .github/scripts/autograde.sh

      - name: bitXor
        id: bitxor
        env:
          TEST_NAME: bitXor
          GRADER_COMMAND: "./check_ops.py --function bitXor bits.c && ./btest -f bitXor"
          EXPECTED_OUTPUT: "Total points: 2/2"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "2"
        run: bash .github/scripts/autograde.sh

      - name: negativePart
        id: negativepart
        env:
          TEST_NAME: negativePart
          GRADER_COMMAND: "./check_ops.py --function negativePart bits.c && ./btest -f negativePart"
          EXPECTED_OUTPUT: "Total points: 3/3"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "3"
        run: bash .github/scripts/autograde.sh

      - name: copyByteWithin
        id: copybytewithin
        env:
          TEST_NAME: copyByteWithin
          GRADER_COMMAND: "./check_ops.py --function copyByteWithin bits.c && ./btest -f copyByteWithin"
          EXPECTED_OUTPUT: "Total points: 4/4"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "4"
        run: bash .github/scripts/autograde.sh

      - name: logicalShift
        id: logicalshift
        env:
          TEST_NAME: logicalShift
          GRADER_COMMAND: "./check_ops.py --function logicalShift bits.c && ./btest -f logicalShift"
          EXPECTED_OUTPUT: "Total points: 4/4"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "4"
        run: bash .github/scripts/autograde.sh

      - name: swapNibblePairs
        id: swapnibblepairs
        env:
          TEST_NAME: swapNibblePairs
          GRADER_COMMAND: "./check_ops.py --function swapNibblePairs bits.c && ./btest -f swapNibblePairs"
          EXPECTED_OUTPUT: "Total points: 4/4"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "4"
        run: bash .github/scripts/autograde.sh

      - name: secondLowestZeroBit
        id: secondlowestzerobit
        env:
          TEST_NAME: secondLowestZeroBit
          GRADER_COMMAND: "./check_ops.py --function secondLowestZeroBit bits.c && ./btest -f secondLowestZeroBit"
          EXPECTED_OUTPUT: "Total points: 4/4"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "4"
        run: bash .github/scripts/autograde.sh

      - name: oddParity
        id: oddparity
